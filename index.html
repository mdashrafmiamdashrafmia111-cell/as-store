<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS STORE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

header {
    text-align: center;
    padding: 32px 15px;
    background: linear-gradient(135deg, #151515, #080808);
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 5px;
}

.subtitle {
    margin-top: 8px;
    color: #999;
    font-size: 14px;
}

.search {
    display: block;
    width: 90%;
    max-width: 600px;
    margin: 25px auto;
    padding: 15px 20px;
    border-radius: 30px;
    border: 1px solid #333;
    background: #151515;
    color: white;
    font-size: 16px;
    outline: none;
}

.search::placeholder {
    color: #777;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: auto;
}

.title {
    font-size: 24px;
    margin: 30px 0 18px;
}

.app-card {
    background: #131313;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
}

.app-icon {
    width: 75px;
    height: 75px;
    border-radius: 20px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 16px;
}

.app-name {
    font-size: 22px;
    font-weight: bold;
}

.info {
    color: #888;
    margin-top: 8px;
    font-size: 14px;
}

.description {
    color: #bbb;
    line-height: 1.5;
    margin: 15px 0 20px;
}

.download {
    display: inline-block;
    padding: 13px 28px;
    border-radius: 28px;
    background: white;
    color: black;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    color: #666;
    padding: 40px 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">AS STORE</div>
    <div class="subtitle">Premium Gaming App Store</div>
</header>

<input
    class="search"
    type="text"
    placeholder="🔎 Search apps..."
>

<div class="container">

    <h2 class="title">🎮 Featured Apps</h2>

    <div class="app-card">

        <div class="app-icon">🎮</div>

        <div class="app-name">
            AS App
        </div>

        <div class="info">
            Version 1.0 • 25 MB
        </div>

        <div class="description">
            A simple and useful app from AS STORE.
        </div>

        <a class="download" href="https://raw.githubusercontent.com/mdashrafmiamdashrafmia111-cell/as-store/main/zarchiver.pro-0.9.4.apk">
            DOWNLOAD
        </a>

    </div>

</div>

<footer>
    © 2026 AS STORE — All Rights Reserved
</footer>

</body>
</html>
