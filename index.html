<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS STORE</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

/* HEADER */

header{
  text-align:center;
  padding:25px 15px;
  background:linear-gradient(135deg,#151515,#080808);
  border-bottom:1px solid #292929;
}

.store-logo{
  width:100px;
  height:100px;
  object-fit:contain;
  border-radius:50%;
  margin-bottom:10px;
}

.logo{
  font-size:38px;
  font-weight:bold;
  letter-spacing:5px;
}

.subtitle{
  margin-top:8px;
  color:#999;
  font-size:14px;
}

/* SEARCH */

.search{
  display:block;
  width:90%;
  max-width:600px;
  margin:25px auto;
  padding:15px 20px;
  border-radius:30px;
  border:1px solid #333;
  background:#151515;
  color:white;
  font-size:16px;
  outline:none;
}

/* CONTAINER */

.container{
  width:92%;
  max-width:700px;
  margin:auto;
}

.title{
  font-size:25px;
  margin:25px 0 15px;
}

/* APP CARD */

.app-card{
  background:#151515;
  border:1px solid #292929;
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.app-top{
  display:flex;
  align-items:center;
  gap:15px;
}

.app-icon{
  width:70px;
  height:70px;
  border-radius:18px;
  object-fit:cover;
  background:#222;
}

.app-name{
  font-size:21px;
  font-weight:bold;
}

.info{
  color:#999;
  font-size:14px;
  margin-top:6px;
}

.description{
  color:#bbb;
  margin:18px 0;
  line-height:1.5;
}

/* DOWNLOAD BUTTON */

.download{
  display:inline-block;
  text-decoration:none;
  background:white;
  color:#111;
  padding:12px 25px;
  border-radius:25px;
  font-weight:bold;
}

.download:hover{
  background:#ddd;
}

/* FOOTER */

footer{
  text-align:center;
  color:#666;
  padding:40px 10px;
}

</style>
</head>

<body>

<!-- AS STORE HEADER -->

<header>

  <img
    src="as-logo.png"
    class="store-logo"
    alt="AS STORE Logo"
  >

  <div class="logo">
    AS STORE
  </div>

  <div class="subtitle">
    Premium Gaming App Store
  </div>

</header>


<!-- SEARCH -->

<input
  class="search"
  id="search"
  type="text"
  placeholder="🔎 Search apps..."
>


<div class="container">

  <h2 class="title">
    🎮 Featured Apps
  </h2>

  <div id="appList"></div>

</div>


<footer>
  © 2026 AS STORE — All Rights Reserved
</footer>


<script>

/* ==================================================
   👇 এখান থেকেই নতুন APP যোগ করবি
   ================================================== */

const apps = [

  {
    name: "ZArchiver",
    version: "1.0",
    size: "25 MB",
    description: "A simple and useful file manager.",
    icon: "images.png",
    download: "./zarchiver.pro-0.9.4.apk"
  },

  {
    name: "App 2",
    version: "1.0",
    size: "30 MB",
    description: "Your second app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 3",
    version: "1.0",
    size: "40 MB",
    description: "Your third app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 4",
    version: "1.0",
    size: "20 MB",
    description: "Your fourth app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 5",
    version: "1.0",
    size: "50 MB",
    description: "Your fifth app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 6",
    version: "1.0",
    size: "35 MB",
    description: "Your sixth app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 7",
    version: "1.0",
    size: "45 MB",
    description: "Your seventh app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  },

  {
    name: "App 8",
    version: "1.0",
    size: "60 MB",
    description: "Your eighth app description.",
    icon: "https://via.placeholder.com/150",
    download: "YOUR_DOWNLOAD_LINK_HERE"
  }

];


/* ==================================================
   নিচের code পরিবর্তন করার দরকার নেই
   ================================================== */

const appList = document.getElementById("appList");

function showApps(list){

  appList.innerHTML = "";

  list.forEach(app => {

    appList.innerHTML += `
      <div class="app-card">

        <div class="app-top">

          <img
            class="app-icon"
            src="${app.icon}"
            alt="${app.name}"
          >

          <div>

            <div class="app-name">
              ${app.name}
            </div>

            <div class="info">
              Version ${app.version} • ${app.size}
            </div>

          </div>

        </div>

        <div class="description">
          ${app.description}
        </div>

        <a
          class="download"
          href="${app.download}"
          target="_blank"
        >
          DOWNLOAD
        </a>

      </div>
    `;

  });

}

showApps(apps);


/* SEARCH */

document.getElementById("search").addEventListener("input", function(){

  const text = this.value.toLowerCase();

  const filtered = apps.filter(app =>
    app.name.toLowerCase().includes(text)
  );

  showApps(filtered);

});

</script>

</body>
  </html>
